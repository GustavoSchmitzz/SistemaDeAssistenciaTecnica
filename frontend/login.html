<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login Da Assistencia</title>

</head>
    <body class="login-body">
        <div class="login-container">
            <h2>Login Assistencia Tecnica</h2>

            <form id="form-login">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="Digite seu email.">
                </div>

                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" required placeholder="Digite sua senha">
                </div>

                <button type="submit" id="botao-entrar">Entrar</button>
                <p id="mensagem-de-erro" class="erro"></p>
            </form>
        </div>

    <script src="js/login.js"></script>
    </body>
</html>
